<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Entry / प्रेषण प्रविष्टि</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header .hindi {
            color: #666;
            font-size: 18px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }
        
        .label-hindi {
            display: block;
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }
        
        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .offline-indicator {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff9800;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
        
        .offline-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="offline-indicator" id="offlineIndicator">
        📴 Offline Mode / ऑफ़लाइन मोड
    </div>
    
    <div class="container">
        <div class="header">
            <h1>📦 Dispatch Entry</h1>
            <div class="hindi">प्रेषण प्रविष्टि</div>
        </div>
        
        <form id="dispatchForm">
            <div class="form-group">
                <label>
                    Invoice Number
                    <span class="label-hindi">चालान संख्या</span>
                </label>
                <input type="text" id="invoice" name="invoice" required placeholder="e.g., INV-001">
            </div>
            
            <div class="form-group">
                <label>
                    Item Name
                    <span class="label-hindi">वस्तु का नाम</span>
                </label>
                <input type="text" id="item" name="item" required placeholder="e.g., Steel Rods / स्टील रॉड">
            </div>
            
            <div class="form-group">
                <label>
                    Quantity
                    <span class="label-hindi">मात्रा</span>
                </label>
                <input type="number" id="quantity" name="quantity" required placeholder="e.g., 100" min="1">
            </div>
            
            <div class="form-group">
                <label>
                    Dispatched By
                    <span class="label-hindi">द्वारा प्रेषित</span>
                </label>
                <input type="text" id="dispatchedBy" name="dispatchedBy" required placeholder="Your name / आपका नाम">
            </div>
            
            <div class="form-group">
                <label>
                    Date
                    <span class="label-hindi">तारीख</span>
                </label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <button type="submit" id="submitBtn">
                ✓ Submit / जमा करें
            </button>
            
            <div class="message" id="message"></div>
        </form>
    </div>
    
    <script>
        // Configuration - REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5bDHpQZNlqQQHz4nfEfKEzvhmtsDZsPH35lRQtq7cfaeVe5Wo3LBxjmNqSw3vlfBLQA/exec';
        
        // Set today's date by default
        document.getElementById('date').valueAsDate = new Date();
        
        // Check online/offline status
        function updateOnlineStatus() {
            const indicator = document.getElementById('offlineIndicator');
            if (!navigator.onLine) {
                indicator.classList.add('show');
            } else {
                indicator.classList.remove('show');
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
        
        // Handle form submission
        document.getElementById('dispatchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const message = document.getElementById('message');
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Submitting... / जमा हो रहा है...';
            
            // Get form data
            const formData = {
                invoice: document.getElementById('invoice').value,
                item: document.getElementById('item').value,
                quantity: document.getElementById('quantity').value,
                dispatchedBy: document.getElementById('dispatchedBy').value,
                date: document.getElementById('date').value
            };
            
            try {
                // Check if online
                if (!navigator.onLine) {
                    throw new Error('No internet connection');
                }
                
                // Send to Google Sheets
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                // Show success message
                showMessage('✓ Submitted successfully! / सफलतापूर्वक जमा हो गया!', 'success');
                
                // Reset form
                document.getElementById('dispatchForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                
            } catch (error) {
                console.error('Error:', error);
                
                // Save to local storage for later sync
                saveToLocalStorage(formData);
                
                showMessage('⚠️ Saved locally. Will sync when online. / स्थानीय रूप से सहेजा गया। ऑनलाइन होने पर सिंक होगा।', 'error');
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = '✓ Submit / जमा करें';
            }
        });
        
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type} show`;
            
            setTimeout(() => {
                message.classList.remove('show');
            }, 4000);
        }
        
        function saveToLocalStorage(data) {
            let pending = JSON.parse(localStorage.getItem('pendingEntries') || '[]');
            pending.push({
                ...data,
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('pendingEntries', JSON.stringify(pending));
        }
        
        // Try to sync pending entries when online
        async function syncPendingEntries() {
            if (!navigator.onLine) return;
            
            let pending = JSON.parse(localStorage.getItem('pendingEntries') || '[]');
            if (pending.length === 0) return;
            
            for (let i = 0; i < pending.length; i++) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(pending[i])
                    });
                    
                    pending.splice(i, 1);
                    i--;
                } catch (error) {
                    console.error('Sync failed:', error);
                    break;
                }
            }
            
            localStorage.setItem('pendingEntries', JSON.stringify(pending));
        }
        
        // Try to sync on page load and when coming online
        window.addEventListener('load', syncPendingEntries);
        window.addEventListener('online', syncPendingEntries);
        
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }
    </script>
</body>
</html>
